<!-- Diaporama -->
<section class="tpb-gallery" id="diaporama">
  <div class="tpb-inner">
    <div class="tpb-gallery__head">
      {{ with .Params.eyebrow }}<span class="tpb-eyebrow">{{ . }}</span>{{ end }}
      {{ with .Title }}<h2>{{ . }}</h2>{{ end }}
    </div>
    <div class="tpb-slider" data-tpb-slider>
      <div class="tpb-slider__track">
        {{ range $i, $s := .Params.slides }}
        <div class="tpb-slide{{ if eq $i 0 }} is-active{{ end }}" style="background-image:url('{{ $s.image }}')" role="img" aria-label="{{ $s.alt }}"></div>
        {{ end }}
      </div>
      <button class="tpb-slider__btn tpb-slider__btn--prev" aria-label="Photo précédente"><span class="fas fa-chevron-left"></span></button>
      <button class="tpb-slider__btn tpb-slider__btn--next" aria-label="Photo suivante"><span class="fas fa-chevron-right"></span></button>
      <div class="tpb-slider__dots">
        {{ range $i, $s := .Params.slides }}
        <button data-index="{{ $i }}" class="{{ if eq $i 0 }}is-active{{ end }}" aria-label="Aller à la photo {{ add $i 1 }}"></button>
        {{ end }}
      </div>
    </div>
  </div>
</section>
