<!-- Manifeste (deux colonnes) -->
<section class="tpb-manifeste" id="manifeste">
  <div class="tpb-inner">
    <div class="tpb-manifeste__head">
      {{ with .Params.eyebrow }}<span class="tpb-eyebrow">{{ . }}</span>{{ end }}
      {{ with .Title }}<h2>{{ . }}</h2>{{ end }}
    </div>
    <div class="tpb-cols">
      {{ range .Pages.ByWeight }}
      <div class="tpb-card tpb-card--{{ .Params.accent }}">
        {{ with .Params.label }}<span class="tpb-card__label">{{ . }}</span>{{ end }}
        {{ .Content }}
      </div>
      {{ end }}
    </div>
  </div>
</section>
