<!-- Citations -->
<section class="tpb-quotes" id="recits">
  <div class="tpb-inner">
    <div class="tpb-quotes__head">
      {{ with .Params.eyebrow }}<span class="tpb-eyebrow">{{ . }}</span>{{ end }}
      {{ with .Title }}<h2>{{ . }}</h2>{{ end }}
    </div>
    <div class="tpb-quotes__grid">
      {{ range .Pages.ByWeight }}
      <figure class="tpb-quote">
        <blockquote class="tpb-quote__text">{{ .Content }}</blockquote>
        <figcaption class="tpb-quote__author">{{ .Params.author }}</figcaption>
      </figure>
      {{ end }}
    </div>
  </div>
</section>
