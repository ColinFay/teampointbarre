<!-- Hero -->
<section class="tpb-hero" id="accueil">
  <div class="tpb-hero__content">
    <img class="tpb-hero__logo" src="/images/logo-tpb.png" alt="Logo Team Point Barre" />
    <h1 class="tpb-sr-only">Team Point Barre</h1>
    {{ with .tagline }}<p class="tpb-hero__tagline">{{ . }}</p>{{ end }}
    <div class="tpb-hero__actions">
      {{ with .button }}<a class="btn btn-primary" href="{{ .link }}" target="_blank" rel="noopener">{{ .label }}</a>{{ end }}
      {{ with .secondary }}<a class="btn btn-ghost smooth-scroll-middle" href="{{ .link }}">{{ .label }}</a>{{ end }}
    </div>
  </div>
  <a class="tpb-hero__scroll smooth-scroll-middle" href="#methode" aria-label="Défiler vers le bas">
    <span class="fas fa-chevron-down"></span>
  </a>
</section>
