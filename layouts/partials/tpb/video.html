<!-- Vidéo méthode -->
<section class="tpb-video" id="methode">
  <div class="tpb-inner">
    <div class="tpb-video__head">
      {{ with .Params.eyebrow }}<span class="tpb-eyebrow">{{ . }}</span>{{ end }}
      <h2>{{ .Title }}</h2>
      {{ .Content }}
    </div>
    {{ with .Params.video }}
    <div class="tpb-video__frame">
      <iframe src="https://www.youtube.com/embed/{{ .code }}" title="{{ .title }}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe>
    </div>
    {{ end }}
  </div>
</section>
