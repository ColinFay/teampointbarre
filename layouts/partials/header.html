<header class="site-header">
  <a class="site-brand" href="/">
    <img src="/images/logo-tpb.png" alt="" width="44" height="44">
    <span>Team Point Barre</span>
  </a>
  <button class="site-nav__toggle" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="Menu">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
  <nav class="site-nav" id="site-nav">
    {{- range site.Menus.main }}
    <a class="site-nav__link{{ if hasPrefix $.RelPermalink .URL }} is-active{{ end }}" href="{{ .URL }}">{{ .Name }}</a>
    {{- end }}
    <a class="btn btn--primary btn--small" href="/rejoindre/">Rejoindre la team</a>
  </nav>
</header>
