<footer class="site-footer grain">
  <div class="inner site-footer__inner">
    <div class="site-footer__brand">
      <img src="/images/logo-tpb.png" alt="Logo Team Point Barre" width="116" height="116" loading="lazy">
      <p class="site-footer__baseline">Pas vite mais tout le temps</p>
    </div>
    <nav class="site-footer__nav">
      {{- range site.Menus.main }}
      <a href="{{ .URL }}">{{ .Name }}</a>
      {{- end }}
      <a href="/rejoindre/">Rejoindre la team</a>
    </nav>
  </div>
  <div class="inner site-footer__bottom">
    <p class="serif">Team Point Barre un jour, Team Point Barre toujours.</p>
    <div class="site-footer__meta">
      {{ with site.Params.social.instagram }}<a href="{{ . }}" target="_blank" rel="noopener">{{ partial "tpb/icon" "instagram" }}<span>@teampointbarre</span></a>{{ end }}
      <span>© {{ now.Year }} Team Point Barre</span>
    </div>
  </div>
</footer>

<script>
  document.querySelector('.site-nav__toggle').addEventListener('click', function () {
    this.setAttribute('aria-expanded', document.body.classList.toggle('nav-open'));
  });
</script>
