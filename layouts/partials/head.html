<head>
  <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} · {{ site.Title }}{{ end }}</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="{{ .Description | default site.Params.description }}">

  {{ partial "favicon" }}

  <!-- Brand fonts (charte Team Point Barre) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap">

  {{ $sapin := resources.Get "css/sapin.css" | minify | fingerprint }}
  <link rel="stylesheet" href="{{ $sapin.RelPermalink }}">
</head>
